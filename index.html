<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>写真収集 進捗状況</title>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);

    --fill-open: #d6d4cb;      /* 対象・未達成 */
    --fill-neutral: #f3f2ee;   /* 対象外 */
    --fill-done: #2f9e44;      /* 対象・達成 */
    --done-text: #1b6b2a;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--page); }
  body {
    margin: 0;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 14px 16px 32px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 2px; }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  .lede { color: var(--ink-2); font-size: 0.88rem; margin: 0; }

  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
  .progress-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .progress-num { font-size: 2rem; font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .progress-num small { font-size: 1rem; font-weight: 600; color: var(--ink-2); }
  .updated { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
  .progress-bar { height: 8px; border-radius: 4px; background: var(--hairline); overflow: hidden; margin-top: 10px; }
  .progress-bar > div { height: 100%; border-radius: 4px; background: var(--fill-done); width: 0%; transition: width .3s; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) {
    .grid { grid-template-columns: minmax(380px, 460px) 1fr; align-items: start; }
    .grid .card { margin-bottom: 0; }
  }

  /* ---- Map ---- */
  #japan-map { width: 100%; height: auto; max-height: 520px; display: block; margin: 0 auto; }
  .pref { fill: var(--fill-neutral); stroke: #fff; stroke-width: 0.7; }
  .pref.target { fill: var(--fill-open); }
  .pref.target.done { fill: var(--fill-done); }
  .inset-box { fill: var(--surface); stroke: var(--hairline); stroke-width: 1; }
  .inset .pref { stroke: #c8c6bd; stroke-width: 0.6; }
  .inset-label { font-size: 9px; fill: var(--muted); }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 0.8rem; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chip { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); display: inline-block; }

  /* ---- Table ---- */
  .tables { display: grid; grid-template-columns: 1fr; gap: 0 24px; }
  @media (min-width: 480px) { .tables { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 479px) { .tables table + table thead { display: none; } }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 0.75rem; }
  td.num { color: var(--muted); font-variant-numeric: tabular-nums; width: 2.5em; }
  td.state { width: 6.5em; }
  .badge {
    display: inline-block; padding: 1px 10px; border-radius: 999px;
    font-size: 0.78rem; font-weight: 600; white-space: nowrap;
  }
  .badge.done { background: #dff3e3; color: var(--done-text); }
  .badge.open { background: transparent; color: var(--ink-2); border: 1px solid var(--hairline); }

  .error { color: #d03b3b; font-size: 0.85rem; display: none; margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="head">
      <div>
        <h1>写真収集 進捗状況</h1>
        <p class="lede">対象の都道府県について、写真の収集状況をお知らせしています。</p>
      </div>
      <div class="progress-row">
        <span class="progress-num"><span id="count-done">–</span><small> / <span id="count-total">–</span> 都道府県 達成</small></span>
        <span class="updated">最終更新: <span id="updated-at">–</span></span>
      </div>
    </div>
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <p class="error" id="load-error">進捗データを読み込めませんでした。時間をおいて再度お試しください。</p>
  </section>

  const DONE_OVERRIDE = params.has("done")

  const fmtDate = (iso) => {

  function render(data) {

      const el = document.getElementById(`pref-${p.code}`);
      if (!el) continue;
      el.classList.add("target");
      if (p.done) el.classList.add("done");
      const t = el.querySelector("title");
      if (t) t.textContent = `${p.name}: ${p.done ? "達成" : "未達成"}`;
    }

    // 一覧表: 都道府県コード順、2列に分けて表示
    const row = (p, i) => {
      const badge = p.done
        ? '<span class="badge done">✓ 達成</span>'
        : '<span class="badge open">未達成</span>';
      return `<tr><td class="num">${i + 1}</td><td>${escapeHtml(p.name)}</td><td class="state">${badge}</td></tr>`;
    };
    const half = Math.ceil(prefs.length / 2);
    document.getElementById("rows-a").innerHTML = prefs.slice(0, half).map((p, i) => row(p, i)).join("");
    document.getElementById("rows-b").innerHTML = prefs.slice(half).map((p, i) => row(p, i + half)).join("");
    document.getElementById("load-error").style.display = "none";
  }

  function load() {
    return fetch(SOURCE, { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(() => {
        document.getElementById("load-error").style.display = "block";
      });
  }

  load();
  // 開いたままのタブでも最新の状況に追従させる（1時間ごと）
  setInterval(load, 60 * 60 * 1000);
</script>
</body>
</html>
